<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>405 - Method Not Allowed</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/error-pages.css') }}">

</head>

<body>

<div class="error-container">

    <div class="error-card">

        <div class="error-number">

            405

        </div>

        <h1>

            Method Not Allowed

        </h1>

        <p>

            This action cannot be performed using the current request method.

        </p>

        <div class="buttons">

            <a href="{{ url_for('pages.dashboard') }}"
               class="btn btn-primary">

                Dashboard

            </a>

            <a href="{{ url_for('auth.home') }}"
               class="btn btn-secondary">

                Home

            </a>

        </div>

    </div>

</div>

</body>

</html>
